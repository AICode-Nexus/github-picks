name: Deploy GitHub Picks to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: "/github-picks"
      GITHUB_PICKS_PUBLIC_BASE_URL: "https://aicode-nexus.github.io/github-picks"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Verify repository
        run: pnpm check

      - name: Build static website
        run: pnpm --filter @github-picks/web build

      - name: Verify public API artifacts
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { join } from "node:path";

          const apiRoot = "apps/web/out/api/v1";
          const requiredPaths = [
            "apps/web/out/api/v1/meta.json",
            "apps/web/out/api/v1/reports/latest.json",
            "apps/web/out/api/v1/reports/index.json",
            "apps/web/out/api/v1/rankings/7d.json",
            "apps/web/out/api/v1/rankings/30d.json",
            "apps/web/out/api/v1/rankings/90d.json",
            "apps/web/out/api/v1/rankings/180d.json",
            "apps/web/out/api/v1/directions/ai-agent.json",
            "apps/web/out/api/v1/directions/data-ml.json",
            "apps/web/out/api/v1/directions/app-platform.json",
            "apps/web/out/api/v1/directions/infra-devtools.json",
            "apps/web/out/api/v1/directions/security-supply-chain.json",
          ];

          async function parseApiDocument(path) {
            const document = JSON.parse(await readFile(path, "utf8"));
            if (document.schemaVersion !== 1) {
              throw new Error(`${path} does not use public API schemaVersion 1`);
            }
            return document;
          }

          const documents = await Promise.all(
            requiredPaths.map((path) => parseApiDocument(path)),
          );
          const meta = documents[0];
          const latest = documents[1];
          const reportIndex = documents[2];
          const reportDate = latest.data?.report?.date;
          const repositoryId = latest.data?.report?.rankings?.overall?.[0];

          if (
            !reportDate ||
            meta.data?.latestReportDate !== reportDate ||
            reportIndex.data?.items?.[0]?.date !== reportDate
          ) {
            throw new Error("meta, latest report, and report index are inconsistent");
          }
          if (!/^[a-z0-9_.-]+\/[a-z0-9_.-]+$/.test(repositoryId ?? "")) {
            throw new Error("latest report does not identify a safe repository path");
          }

          await parseApiDocument(join(apiRoot, "reports", `${reportDate}.json`));
          await parseApiDocument(join(apiRoot, "repositories", `${repositoryId}.json`));
          NODE

      - name: Disable Jekyll processing
        run: touch apps/web/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
